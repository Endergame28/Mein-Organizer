name: Build Mein Organizer APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Android APK bauen
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # Repository
      # ==========================================
      - name: Repository auschecken
        uses: actions/checkout@v4


      # ==========================================
      # Python
      # ==========================================
      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================
      # Java
      # ==========================================
      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # Java prüfen
      # ==========================================
      - name: Java Version prüfen
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version


      # ==========================================
      # Linux Abhängigkeiten
      # ==========================================
      - name: Linux-Abhängigkeiten installieren
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev


      # ==========================================
      # Buildozer
      # ==========================================
      - name: Buildozer installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

          pip install "buildozer==1.5.0"
          pip install "cython==0.29.36"

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Python:"
          python --version


      # ==========================================
      # Buildozer Cache löschen
      # ==========================================
      - name: Alten Buildozer Cache löschen
        run: |
          rm -rf "$HOME/.buildozer"

          mkdir -p "$HOME/.buildozer/android/platform/android-sdk"

          echo "Buildozer Cache vorbereitet."


      # ==========================================
      # Android SDK installieren
      # ==========================================
      - name: Android SDK installieren
        run: |

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="

          mkdir -p "$SDK/cmdline-tools"
          mkdir -p "$SDK/tools/bin"


          # --------------------------------------
          # Command Line Tools
          # --------------------------------------

          CMDLINE_VERSION="11076708"

          echo "Lade Android Command Line Tools..."

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_VERSION}_latest.zip" \
            -O /tmp/cmdline-tools.zip


          unzip -q \
            /tmp/cmdline-tools.zip \
            -d "$SDK/cmdline-tools"


          rm -rf "$SDK/cmdline-tools/latest"

          mv \
            "$SDK/cmdline-tools/cmdline-tools" \
            "$SDK/cmdline-tools/latest"


          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"


          if [ ! -f "$SDKMANAGER" ]; then
            echo "FEHLER: sdkmanager fehlt!"
            exit 1
          fi


          echo "sdkmanager:"
          echo "$SDKMANAGER"


          # --------------------------------------
          # Buildozer-kompatibler Pfad
          # --------------------------------------

          ln -sf \
            "$SDKMANAGER" \
            "$SDK/tools/bin/sdkmanager"


          # --------------------------------------
          # Lizenzen akzeptieren
          # --------------------------------------

          echo ""
          echo "Akzeptiere Android SDK Lizenzen..."

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses || true


          # --------------------------------------
          # SDK Pakete installieren
          # --------------------------------------

          echo ""
          echo "Installiere Android SDK Pakete..."

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "build-tools;37.0.0"


          echo ""
          echo "=========================================="
          echo "ANDROID SDK FERTIG"
          echo "=========================================="

          echo ""
          echo "Installierte Build Tools:"

          ls -la "$SDK/build-tools"


      # ==========================================
      # AIDL prüfen
      # ==========================================
      - name: AIDL überprüfen
        run: |

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "AIDL"
          echo "=========================================="


          AIDL=$(find \
            "$SDK/build-tools" \
            -type f \
            -name aidl \
            | sort \
            | tail -1)


          if [ -z "$AIDL" ]; then

            echo ""
            echo "FEHLER: AIDL wurde nicht gefunden!"

            echo ""
            echo "Build Tools Inhalt:"

            find \
              "$SDK/build-tools" \
              -maxdepth 3 \
              -type f \
              | head -200

            exit 1

          fi


          echo ""
          echo "AIDL gefunden:"
          echo "$AIDL"

          echo ""
          echo "AIDL Version:"

          "$AIDL" --version || true


      # ==========================================
      # SDK Umgebungsvariablen
      # ==========================================
      - name: Android Umgebungsvariablen setzen
        run: |

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/37.0.0" >> "$GITHUB_PATH"

          echo ""
          echo "Android SDK:"
          echo "$SDK"


      # ==========================================
      # APK bauen
      # ==========================================
      - name: APK bauen
        id: build
        continue-on-error: true
        run: |

          echo "=========================================="
          echo "MEIN ORGANIZER APK BUILD"
          echo "=========================================="

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Build Tools:"
          ls -la "$ANDROID_HOME/build-tools"

          echo ""
          echo "Starte Buildozer..."

          buildozer android debug 2>&1 | tee build.log

          exit ${PIPESTATUS[0]}


      # ==========================================
      # Build Log
      # ==========================================
      - name: Build-Log hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: build.log
          if-no-files-found: warn


      # ==========================================
      # APK hochladen
      # ==========================================
      - name: APK hochladen
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Mein-Organizer-APK
          path: bin/*.apk
          if-no-files-found: error


      # ==========================================
      # Fehler
      # ==========================================
      - name: Build fehlgeschlagen
        if: steps.build.outcome != 'success'
        run: |

          echo ""
          echo "=========================================="
          echo "APK BUILD FEHLGESCHLAGEN"
          echo "=========================================="

          echo ""
          echo "Siehe Artifact: Build-Log"

          exit 1
