      - name: Android SDK und AIDL installieren
        run: |
          SDK="$ANDROID_HOME"

          echo "Android SDK: $SDK"

          echo "Suche sdkmanager..."

          SDKMANAGER=$(find "$SDK" -type f -name sdkmanager | head -1)

          if [ -z "$SDKMANAGER" ]; then
            echo "FEHLER: sdkmanager wurde nicht gefunden!"
            find "$SDK" -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "sdkmanager gefunden:"
          echo "$SDKMANAGER"

          chmod +x "$SDKMANAGER"

          echo "Installiere Android Build Tools..."

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses || true

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "=== AIDL suchen ==="

          find "$SDK/build-tools" \
            -name "aidl" \
            -type f \
            -print
