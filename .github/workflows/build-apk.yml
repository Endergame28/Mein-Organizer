name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Systemabhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Python-Pakete installieren
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer
          pip install "cython==0.29.36"

      - name: Buildozer Cache
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: APK bauen
        id: build
        continue-on-error: true
        run: |
          buildozer android debug 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Build-Log hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: build.log
          if-no-files-found: warn

      - name: APK hochladen
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Mein-Organizer-APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Build-Fehler anzeigen
        if: steps.build.outcome != 'success'
        run: |
          echo "======================================"
          echo "DER APK-BUILD IST FEHLGESCHLAGEN"
          echo "======================================"
          echo ""
          echo "Die vollständige Fehlermeldung befindet sich"
          echo "im Artifact 'Build-Log'."
          echo ""
          exit 1
