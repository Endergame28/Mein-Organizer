name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ─────────────────────────────────────
      # Repository
      # ─────────────────────────────────────
      - name: Repository auschecken
        uses: actions/checkout@v4


      # ─────────────────────────────────────
      # Python
      # ─────────────────────────────────────
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ─────────────────────────────────────
      # Linux-Abhängigkeiten
      # ─────────────────────────────────────
      - name: Linux-Abhängigkeiten installieren
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev


      # ─────────────────────────────────────
      # Buildozer
      # ─────────────────────────────────────
      - name: Buildozer installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

          pip install buildozer
          pip install "cython==0.29.36"


      # ─────────────────────────────────────
      # Android SDK
      # ─────────────────────────────────────
      - name: Android SDK vorbereiten
        run: |
          SDK="$ANDROID_HOME"

          echo "======================================"
          echo "Android SDK"
          echo "======================================"
          echo "$SDK"
          echo ""

          echo "Suche sdkmanager..."

          SDKMANAGER=$(find "$SDK" \
            -type f \
            -name sdkmanager \
            | head -1)

          if [ -z "$SDKMANAGER" ]; then
            echo "FEHLER: sdkmanager wurde nicht gefunden!"
            echo ""
            echo "SDK-Inhalt:"
            find "$SDK" -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "sdkmanager gefunden:"
          echo "$SDKMANAGER"
          echo ""

          echo "Installiere Android SDK Komponenten..."

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses || true

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "Android SDK erfolgreich vorbereitet."


      # ─────────────────────────────────────
      # AIDL prüfen
      # ─────────────────────────────────────
      - name: AIDL überprüfen
        run: |
          SDK="$ANDROID_HOME"

          echo "======================================"
          echo "AIDL Suche"
          echo "======================================"

          AIDL=$(find "$SDK/build-tools" \
            -name aidl \
            -type f \
            | head -1)

          if [ -z "$AIDL" ]; then
            echo "FEHLER: AIDL wurde nicht gefunden!"
            echo ""
            echo "Vorhandene Build Tools:"
            find "$SDK/build-tools" \
              -maxdepth 3 \
              -type f \
              | head -200
            exit 1
          fi

          echo "AIDL gefunden:"
          echo "$AIDL"
          echo ""

          echo "AIDL Version:"
          "$AIDL" --version || true


      # ─────────────────────────────────────
      # Buildozer SDK konfigurieren
      # ─────────────────────────────────────
      - name: Buildozer SDK konfigurieren
        run: |
          mkdir -p "$HOME/.buildozer/android/platform"

          rm -rf \
            "$HOME/.buildozer/android/platform/android-sdk"

          ln -s \
            "$ANDROID_HOME" \
            "$HOME/.buildozer/android/platform/android-sdk"

          echo "Buildozer Android SDK:"
          ls -la "$HOME/.buildozer/android/platform/"


      # ─────────────────────────────────────
      # APK bauen
      # ─────────────────────────────────────
      - name: APK bauen
        id: build
        continue-on-error: true
        run: |
          echo "======================================"
          echo "BUILD ANDROID APK"
          echo "======================================"

          buildozer android debug 2>&1 | tee build.log

          exit ${PIPESTATUS[0]}


      # ─────────────────────────────────────
      # Build-Log speichern
      # ─────────────────────────────────────
      - name: Build-Log hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: build.log
          if-no-files-found: warn


      # ─────────────────────────────────────
      # APK speichern
      # ─────────────────────────────────────
      - name: APK hochladen
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Mein-Organizer-APK
          path: bin/*.apk
          if-no-files-found: error


      # ─────────────────────────────────────
      # Fehler anzeigen
      # ─────────────────────────────────────
      - name: Fehler melden
        if: steps.build.outcome != 'success'
        run: |
          echo ""
          echo "======================================"
          echo " APK-BUILD FEHLGESCHLAGEN"
          echo "======================================"
          echo ""
          echo "Der vollständige Build-Log wurde"
          echo "als Artifact 'Build-Log' gespeichert."
          echo ""
          exit 1
