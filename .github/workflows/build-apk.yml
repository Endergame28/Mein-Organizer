name: Build Mein Organizer APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Android APK bauen
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # Repository
      # ==========================================
      - name: Repository auschecken
        uses: actions/checkout@v4


      # ==========================================
      # Python 3.11
      # ==========================================
      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================
      # Java 17
      # ==========================================
      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # Java prüfen
      # ==========================================
      - name: Java prüfen
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version


      # ==========================================
      # Linux-Abhängigkeiten
      # ==========================================
      - name: Linux-Abhängigkeiten installieren
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev


      # ==========================================
      # Buildozer
      # ==========================================
      - name: Buildozer installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

          pip install "buildozer==1.5.0"
          pip install "cython==0.29.36"

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Python:"
          python --version


      # ==========================================
      # Buildozer Cache löschen
      # ==========================================
      # Wichtig, damit keine alte/falsche
      # python-for-android Installation verwendet wird.
      # ==========================================
      - name: Buildozer Cache vorbereiten
        run: |
          rm -rf "$HOME/.buildozer"

          mkdir -p "$HOME/.buildozer"

          echo "Buildozer Cache wurde zurückgesetzt."


      # ==========================================
      # Android Build
      # ==========================================
      - name: APK bauen
        id: build
        continue-on-error: true
        run: |

          echo "=========================================="
          echo " MEIN ORGANIZER APK BUILD"
          echo "=========================================="

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "=========================================="
          echo " Starte Buildozer"
          echo "=========================================="

          buildozer android debug 2>&1 | tee build.log

          exit ${PIPESTATUS[0]}


      # ==========================================
      # Build Log hochladen
      # ==========================================
      - name: Build-Log hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: build.log
          if-no-files-found: warn


      # ==========================================
      # APK hochladen
      # ==========================================
      - name: APK hochladen
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Mein-Organizer-APK
          path: bin/*.apk
          if-no-files-found: error


      # ==========================================
      # Fehler melden
      # ==========================================
      - name: Build fehlgeschlagen
        if: steps.build.outcome != 'success'
        run: |
          echo ""
          echo "=========================================="
          echo " APK BUILD FEHLGESCHLAGEN"
          echo "=========================================="
          echo ""
          echo "Der vollständige Build-Log wurde als"
          echo "'Build-Log' Artifact gespeichert."
          echo ""
          exit 1
