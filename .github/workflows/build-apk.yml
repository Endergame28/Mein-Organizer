name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # Repository
      # ==========================================
      - name: Repository auschecken
        uses: actions/checkout@v4


      # ==========================================
      # Python
      # ==========================================
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================
      # Linux-Abhängigkeiten
      # ==========================================
      - name: Linux-Abhängigkeiten installieren
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev


      # ==========================================
      # Buildozer
      # ==========================================
      - name: Buildozer installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

          pip install buildozer
          pip install "cython==0.29.36"


      # ==========================================
      # Buildozer Android SDK vorbereiten
      # ==========================================
      - name: Android SDK für Buildozer vorbereiten
        run: |

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "Buildozer Android SDK"
          echo "=========================================="

          mkdir -p "$SDK/tools/bin"


          # --------------------------------------
          # Moderne Android Command Line Tools
          # --------------------------------------

          CMDLINE_VERSION="11076708"

          echo "Lade Android Command Line Tools..."

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_VERSION}_latest.zip" \
            -O /tmp/cmdline-tools.zip


          # --------------------------------------
          # Entpacken
          # --------------------------------------

          mkdir -p "$SDK/cmdline-tools"

          unzip -q \
            /tmp/cmdline-tools.zip \
            -d "$SDK/cmdline-tools"


          # --------------------------------------
          # Moderne Struktur herstellen
          # --------------------------------------

          rm -rf "$SDK/cmdline-tools/latest"

          mv \
            "$SDK/cmdline-tools/cmdline-tools" \
            "$SDK/cmdline-tools/latest"


          # --------------------------------------
          # sdkmanager
          # --------------------------------------

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          echo "sdkmanager:"
          echo "$SDKMANAGER"


          if [ ! -f "$SDKMANAGER" ]; then
            echo "FEHLER: sdkmanager nicht gefunden!"
            exit 1
          fi


          # --------------------------------------
          # Buildozer erwartet alten Pfad:
          #
          # tools/bin/sdkmanager
          #
          # Deshalb erstellen wir dort einen
          # Symlink auf das moderne sdkmanager.
          # --------------------------------------

          ln -sf \
            "$SDKMANAGER" \
            "$SDK/tools/bin/sdkmanager"


          echo ""
          echo "Buildozer sdkmanager:"
          echo "$SDK/tools/bin/sdkmanager"


          if [ ! -f "$SDK/tools/bin/sdkmanager" ]; then
            echo "FEHLER: Buildozer sdkmanager fehlt!"
            exit 1
          fi


          # --------------------------------------
          # SDK-Lizenzen
          # --------------------------------------

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses || true


          # --------------------------------------
          # Android Komponenten
          # --------------------------------------

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


          echo ""
          echo "=========================================="
          echo "Android SDK fertig"
          echo "=========================================="

          echo ""
          echo "Build Tools:"
          ls -la "$SDK/build-tools"


      # ==========================================
      # AIDL prüfen
      # ==========================================
      - name: AIDL überprüfen
        run: |

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "AIDL überprüfen"
          echo "=========================================="

          AIDL=$(find \
            "$SDK/build-tools" \
            -type f \
            -name aidl \
            | head -1)


          if [ -z "$AIDL" ]; then
            echo ""
            echo "FEHLER: AIDL wurde nicht gefunden!"
            echo ""

            find \
              "$SDK/build-tools" \
              -maxdepth 3 \
              -type f \
              | head -200

            exit 1
          fi


          echo ""
          echo "AIDL gefunden:"
          echo "$AIDL"

          echo ""
          echo "AIDL Version:"

          "$AIDL" --version || true


      # ==========================================
      # Buildozer APK
      # ==========================================
      - name: APK bauen
        id: build
        continue-on-error: true
        run: |

          echo "=========================================="
          echo "BUILD ANDROID APK"
          echo "=========================================="

          buildozer android debug 2>&1 | tee build.log

          exit ${PIPESTATUS[0]}


      # ==========================================
      # Build Log
      # ==========================================
      - name: Build-Log hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: build.log
          if-no-files-found: warn


      # ==========================================
      # APK
      # ==========================================
      - name: APK hochladen
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Mein-Organizer-APK
          path: bin/*.apk
          if-no-files-found: error


      # ==========================================
      # Fehler
      # ==========================================
      - name: Fehler melden
        if: steps.build.outcome != 'success'
        run: |

          echo ""
          echo "=========================================="
          echo "APK-BUILD FEHLGESCHLAGEN"
          echo "=========================================="

          echo ""
          echo "Der vollständige Build-Log befindet sich"
          echo "im Artifact 'Build-Log'."

          exit 1
