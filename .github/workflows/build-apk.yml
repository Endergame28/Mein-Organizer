name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Linux-Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Buildozer installieren
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer
          pip install "cython==0.29.36"

      - name: Buildozer Android SDK vorbereiten
        run: |
          buildozer android debug 2>&1 | tee sdk-setup.log || true

      - name: Android Build Tools installieren
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "Android SDK:"
          echo "$SDK"

          echo "SDK-Inhalt:"
          find "$SDK" -maxdepth 3 -type d | head -100

          SDKMANAGER=$(find "$SDK" -name sdkmanager -type f | head -1)

          if [ -z "$SDKMANAGER" ]; then
            echo "FEHLER: sdkmanager wurde nicht gefunden."
            exit 1
          fi

          echo "SDK Manager:"
          echo "$SDKMANAGER"

          chmod +x "$SDKMANAGER"

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses || true

          echo "AIDL suchen:"
          find "$SDK/build-tools" -name aidl -type f -print

      - name: AIDL prüfen
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          AIDL=$(find "$SDK/build-tools" -name aidl -type f | head -1)

          if [ -z "$AIDL" ]; then
            echo "FEHLER: AIDL wurde nicht gefunden!"
            exit 1
          fi

          echo "AIDL gefunden:"
          echo "$AIDL"

          chmod +x "$AIDL"

          "$AIDL" --version || true

      - name: APK bauen
        id: build
        continue-on-error: true
        run: |
          buildozer android debug 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Build-Log hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: build.log
          if-no-files-found: warn

      - name: APK hochladen
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Mein-Organizer-APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Fehler melden
        if: steps.build.outcome != 'success'
        run: |
          echo "APK-BUILD FEHLGESCHLAGEN"
          exit 1
